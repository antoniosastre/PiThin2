# =====================================================================
#  PiThin - configuración principal
# =====================================================================
#
#  Este fichero se lee en cada arranque desde:
#      /boot/firmware/pithin/pithin.conf
#
#  Puedes editarlo metiendo la tarjeta SD en cualquier ordenador: la
#  partición de arranque se ve como una unidad normal en Windows, macOS
#  y Linux.
#
#  Formato: CLAVE="valor". Las líneas que empiezan por # son comentarios.
#  No pongas espacios alrededor del signo igual.
#
# =====================================================================


# ---------------------------------------------------------------------
#  DESTINO REMOTO
# ---------------------------------------------------------------------

# Nombre del PC dentro de tu red de Tailscale, o su IP 100.x.y.z
# Míralo en https://login.tailscale.com/admin/machines
RDP_HOST="mi-pc-windows"

# Usuario con el que iniciar sesión en Windows.
#
#   - Cuenta local de Windows ......  RDP_USER="Antonio"
#   - Cuenta Microsoft .............  RDP_USER="MicrosoftAccount\\tu@correo.com"
#   - Equipo en dominio ............  RDP_USER="Antonio" y RDP_DOMINIO="MIEMPRESA"
#
# Ojo: en cuentas Microsoft hacen falta las dos barras invertidas.
RDP_USER="MicrosoftAccount\\tu@correo.com"

# Dominio de Active Directory. Déjalo vacío si no usas dominio.
RDP_DOMINIO=""

# Puerto RDP. 3389 salvo que lo hayas cambiado en Windows.
RDP_PUERTO="3389"


# ---------------------------------------------------------------------
#  PANTALLA Y RENDIMIENTO
# ---------------------------------------------------------------------

# Resolución de la sesión remota.
#
#   1920x1080  Nítido y cómodo. Recomendado para trabajo de escritorio.
#   1600x900   Punto intermedio.
#   1280x720   Bastante más fluido. Úsalo si notas la sesión pesada
#              o si el WiFi va justo.
#
# Este es el ajuste que más impacto tiene en la fluidez. Si algo va
# lento, prueba a bajarlo antes que ninguna otra cosa.
RESOLUCION="1920x1080"

# Profundidad de color: 32 (calidad) o 16 (ahorra ancho de banda y CPU).
PROFUNDIDAD_COLOR="32"

# Códec de vídeo remoto.
#
#   progressive  RemoteFX Progressive. RECOMENDADO en la Zero 2 W:
#                es el más ligero de decodificar por software.
#   rfx          RemoteFX clásico. Alternativa si progressive falla.
#   avc420       H.264. Mejor compresión, pero mucha más CPU. La Zero 2 W
#                no puede acelerarlo por hardware; suele ir peor.
#   auto         Deja que Windows y FreeRDP negocien. Impredecible aquí.
CODEC="progressive"

# Modo cliente ligero: reduce el uso de cachés y memoria. Déjalo en "si"
# salvo que estés depurando.
MODO_CLIENTE_LIGERO="si"

# Perfil de red que se anuncia al servidor. Windows ajusta efectos
# visuales, fondos y animaciones en función de esto.
#   modem | broadband | wan | lan | auto
# "wan" desactiva la mayoría de florituras y va bien aquí.
PERFIL_RED="wan"


# ---------------------------------------------------------------------
#  PERIFÉRICOS Y COMODIDAD
# ---------------------------------------------------------------------

# Compartir el portapapeles entre la Raspberry y Windows.
PORTAPAPELES="si"

# Redirigir el sonido de Windows a la salida de la Raspberry.
# Consume ancho de banda y CPU. Desactivado por defecto.
SONIDO="no"

# Distribución de teclado del teclado físico conectado a la Pi.
# es = español, us = inglés EEUU, latam = latinoamericano.
TECLADO="es"

# Redirigir unidades USB que conectes a la Pi hacia la sesión de Windows.
UNIDADES_USB="no"


# ---------------------------------------------------------------------
#  COMPORTAMIENTO AL ARRANCAR
# ---------------------------------------------------------------------

# "si"  = al encender, conecta directamente sin preguntar nada
#         (te pedirá el PIN si tienes la contraseña guardada).
# "no"  = al encender, muestra el menú principal.
AUTOCONECTAR="si"

# Si la sesión se corta por un problema de red, reintentar sola.
RECONEXION_AUTOMATICA="si"

# Segundos de espera entre reintentos de reconexión.
RECONEXION_ESPERA="5"

# Número máximo de reintentos seguidos antes de volver al menú.
# 0 = reintentar indefinidamente.
RECONEXION_MAX_INTENTOS="10"


# ---------------------------------------------------------------------
#  RED Y VPN
# ---------------------------------------------------------------------

# Segundos que se espera a tener conexión WiFi antes de abrir el
# asistente de redes.
ESPERA_WIFI="25"

# Segundos que se espera a que Tailscale establezca el túnel.
ESPERA_TAILSCALE="30"

# Guardar automáticamente en redes.conf las redes nuevas a las que te
# conectes desde el asistente, para que la próxima vez entre sola.
GUARDAR_REDES_NUEVAS="si"


# ---------------------------------------------------------------------
#  AVANZADO
# ---------------------------------------------------------------------

# Argumentos extra para xfreerdp3, por si necesitas afinar algo.
# Se añaden al final del comando. Déjalo vacío si no sabes qué poner.
FREERDP_EXTRA=""

# Ignorar el aviso de certificado del servidor. Con Tailscale el canal
# ya va cifrado extremo a extremo, así que es razonable dejarlo en "si"
# para no tener que aceptar el certificado en cada arranque.
IGNORAR_CERTIFICADO="si"
