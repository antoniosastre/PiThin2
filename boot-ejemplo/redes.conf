# =====================================================================
#  PiThin - redes WiFi conocidas
# =====================================================================
#
#  Se lee en cada arranque desde:
#      /boot/firmware/pithin/redes.conf
#
#  Puedes editarlo metiendo la tarjeta SD en cualquier ordenador.
#
#  La Raspberry busca estas redes al encender y se conecta a la de mayor
#  prioridad que tenga al alcance. Si no encuentra ninguna, abre un
#  asistente en pantalla para elegir una nueva.
#
# ---------------------------------------------------------------------
#  FORMATO
# ---------------------------------------------------------------------
#
#  Cada red es un bloque que empieza con el nombre de la red (SSID)
#  entre corchetes:
#
#      [Nombre de la red]
#      clave = la contraseña
#      prioridad = 100
#
#  clave       La contraseña del WiFi. Déjala vacía para redes abiertas.
#  prioridad   Número. Cuanto más alto, antes se intenta. Por defecto 50.
#  oculta      Ponlo a "si" si la red no emite su nombre. Por defecto no.
#
#  El SSID va tal cual, con espacios y acentos si los tiene, sin
#  comillas. La contraseña también va tal cual: si contiene #, espacios
#  o símbolos raros, no hay que escapar nada.
#
#  ATENCIÓN: las contraseñas están en texto plano. Cualquiera que meta
#  esta tarjeta en un ordenador puede leerlas. No es evitable en una
#  partición de arranque FAT32. La contraseña de Windows sí va cifrada
#  y protegida por PIN: ver docs/seguridad.md
#
# ---------------------------------------------------------------------
#  EJEMPLOS  (borra estos y pon los tuyos)
# ---------------------------------------------------------------------

[MiCasa]
clave = laClaveDeCasa
prioridad = 100

[Oficina]
clave = otraClaveDistinta
prioridad = 80

# Red del móvil compartiendo datos, por si estás fuera de cobertura.
[iPhone de Antonio]
clave = miclavedelmovil
prioridad = 60

# Ejemplo de red abierta, sin contraseña.
[WiFi-Hotel]
clave =
prioridad = 10

# Ejemplo de red que no emite su nombre.
# [RedOculta]
# clave = suClave
# prioridad = 70
# oculta = si
